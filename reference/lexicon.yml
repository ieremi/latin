# 語彙辞典
#
# 実習で出てきた語や接尾辞の記載事項をまとめる．
# 項目は見出しのアルファベット順（ハイフンは無視）に並べる．文体は常体とする．
# ラテン語には長音符を付けない．ギリシア語の転写と再建形は原表記のままにする．
#
# 記載事項
#   見出し: 見出し語
#   品詞: 品詞
#   主要形: 見出し語の主要な形．1 つずつ項目にする．
#     動詞は 現在，不定詞，完了，目的分詞．
#     名詞は 単数主格，単数属格．
#     形容詞は 男性，女性，中性の単数主格．
#   活用: 動詞の活用の番号（int）
#   曲用: 名詞と形容詞の曲用の番号（int）．第 1・2 曲用の形容詞は [1, 2]．
#     名詞化の接尾辞は，できる名詞の曲用の番号．
#   性: 名詞の性．曲用がある名詞のみ．
#   幹型: 第 3 曲用の語幹の型．
#   語義: 語義
#   語源: 語源
#   ギリシア語由来: ギリシア語由来かどうか（bool）
#   用例: 用例
#   備考: その他

- 見出し: ad-
  品詞: 接頭辞
  語義: 「...へ，...のそばに」．
  語源: ラテン語の前置詞 ad に由来する．
  ギリシア語由来: false
  用例:
    - 内転筋 adductor．
    - appendo 「つるす」．d が p に同化して ap- になる．
  備考: 後ろの子音に同化する（ap-, ac- など）．

- 見出し: appendix
  品詞: 名詞
  主要形:
    - appendix
    - appendicis
  曲用: 3
  性: 女性
  幹型: 子音幹
  語義: 「付属物，追加」．解剖学では「垂」．
  語源: appendo 「つるす」に接尾辞 -ix が付いた形．appendo は ap- + pendo に分けられる．
  ギリシア語由来: false
  用例:
    - 腹膜垂 appendices epiploicae．
    - 虫垂炎 appendicitis．ラテン語でも英語でも同じつづりである．
    - 精巣上体垂 appendix epididymis，精巣垂 appendix testis．
    - 英語 appendix 「付録，虫垂」，appendage 「付属物」．

- 見出し: appendo
  品詞: 動詞
  主要形:
    - appendo
    - appendere
    - appendi
    - appensum
  活用: 3
  語義: 「つるす，ぶら下げる」．「量る」．
  語源: ad- + pendo．ad- の d が p に同化して ap- になった．
  ギリシア語由来: false
  用例:
    - appendix 「付属物，垂」．
    - 英語 append 「付け加える」．

- 見出し: -arium
  品詞: 接尾辞（名詞化）
  主要形:
    - -arium
    - -arii
  曲用: 2
  性: 中性
  語義: 「...のある場所，...に使う道具」を表す名詞を作る．
  語源: 形容詞を作る接尾辞 -arius の中性形が，名詞になったもの．
  ギリシア語由来: false
  用例:
    - ovarium 「卵巣」．
    - armarium 「戸棚」，columbarium 「鳩小屋」．
    - 英語 aquarium 「水族館」，planetarium 「プラネタリウム」，herbarium 「植物標本館」．

- 見出し: -arius
  品詞: 接尾辞（形容詞化）
  主要形:
    - -arius
    - -aria
    - -arium
  曲用: [1, 2]
  語義: 「...に関する，...に属する」．名詞から形容詞を作る．
  語源: 前ラテン語 *-āsios に由来する．
  ギリシア語由来: false
  用例:
    - urinarius 「尿の」．膀胱 vesica urinaria で使う．
    - coronarius 「冠状の」．
    - intertransversarius 「横突間の」．横突間筋 mm. intertransversarii で使う．
    - 英語 -ary （urinary, coronary など）．
  備考: 「...を扱う人，商人」を表す男性名詞も作る．

- 見出し: -atio
  品詞: 接尾辞（名詞化）
  主要形:
    - -atio
    - -ationis
  曲用: 3
  性: 女性
  語義: 動詞から「...すること，...した結果」を表す名詞を作る．
  語源: 第 1 活用の動詞の目的分詞幹の語尾 -at- に，接尾辞 -io （-tio）が付いた形．-tio は前イタリア語 *-tiō に由来する．
  ギリシア語由来: false
  用例:
    - excavatio 「くぼみ」．直腸子宮窩 excavatio rectouterina で使う．
    - articulatio 「関節」．
    - 英語 -ation （excavation, articulation など）．

- 見出し: cavo
  品詞: 動詞
  主要形:
    - cavo
    - cavare
    - cavavi
    - cavatum
  活用: 1
  語義: 「くり抜く，うつろにする」．
  語源: cavus 「うつろな」から作られた動詞．
  ギリシア語由来: false
  用例:
    - excavo 「くり抜く」．
  備考: 主要形は第 1 活用の規則どおりに補ったもので，辞書では確認していない．

- 見出し: cavus
  品詞: 形容詞
  主要形:
    - cavus
    - -a
    - -um
  曲用: [1, 2]
  語義: 「うつろな，くぼんだ」．
  語源: 前イタリア語 *kawos に由来し，印欧祖語 *ḱowh₁ós 「うつろな」に遡るかもしれない．
  ギリシア語由来: false
  用例:
    - cavum 「腔」．胸腔 cavum thoracis で使う．
    - 英語 cavity 「腔」，concave 「凹んだ」．

- 見出し: colon
  品詞: 名詞
  主要形:
    - colon
    - coli
  曲用: 2
  性: 中性
  語義: 「結腸，大腸」．
  語源: ギリシア語 κόλον (kólon) 「大腸」の借用．
  ギリシア語由来: true
  用例:
    - 上行結腸 colon ascendens，横行結腸 colon transversum．
    - 結腸間膜 mesocolon．
    - 英語 colitis 「大腸炎」，colic 「疝痛」は colon に由来する．

- 見出し: enter-
  品詞: 名詞語幹（連結形）
  語義: 「腸，内臓」．
  語源: ギリシア語 ἔντερον (énteron) に由来する．印欧祖語 *h₁én 「中に」に比較級の接尾辞 *-teros が付いた形とされる．
  ギリシア語由来: true
  用例:
    - 腸間膜 mesenterium．
    - 腸内細菌の一属 Enterobacter．
    - 英語 enteritis 「腸炎」，dysentery 「赤痢」．
  備考: 元のギリシア語 ἔντερον は第 2 曲用中性．

- 見出し: epiplo-
  品詞: 名詞語幹（連結形）
  語義: 「大網」．
  語源: ギリシア語 ἐπίπλοον (epíploon) に由来する．ἐπι- 「上に」に「膜」を表す語根が付いた形とされる．
  ギリシア語由来: true
  用例:
    - 腹膜垂 appendices epiploicae，網嚢孔 foramen epiploicum．
    - 右胃大網動脈 a. gastroepiploica dextra．
    - 英語 epiploon 「大網」，epiplocele 「大網ヘルニア」．
  備考: 元のギリシア語 ἐπίπλοον は第 2 曲用中性．

- 見出し: ex-
  品詞: 接頭辞
  語義: 「外へ，外に」．
  語源: ラテン語の前置詞 ex に由来する．
  ギリシア語由来: false
  用例:
    - excavatio 「くぼみ」，excavo 「くり抜く」．
    - exhaurio 「くみ出す」．
    - 英語 exhaust 「使い果たす」，excavate 「掘る」．

- 見出し: excavatio
  品詞: 名詞
  主要形:
    - excavatio
    - excavationis
  曲用: 3
  性: 女性
  幹型: 子音幹
  語義: 「くり抜くこと」．解剖学では「くぼみ，窩」．
  語源: excavo 「くり抜く」の語幹 excav- に -atio が付いた形．excavo は ex- + cavo に分けられる．
  ギリシア語由来: false
  用例:
    - 直腸子宮窩 excavatio rectouterina．
    - 英語 excavation 「発掘」．

- 見出し: excavo
  品詞: 動詞
  主要形:
    - excavo
    - excavare
    - excavavi
    - excavatum
  活用: 1
  語義: 「くり抜く，掘る」．
  語源: ex- + cavo．
  ギリシア語由来: false
  用例:
    - excavatio 「くぼみ」．
    - 英語 excavate 「掘る」．
  備考: 主要形は第 1 活用の規則どおりに補ったもので，辞書では確認していない．

- 見出し: haurio
  品詞: 動詞
  主要形:
    - haurio
    - haurire
    - hausi
    - haustum
  活用: 4
  語義: 「くみ上げる，くみ出す」．転じて「飲みほす，吸い込む，使い尽くす，取り出す」．
  語源: 印欧祖語 *h₂ews- 「くみ上げる」に由来する．語頭の h- は後から付いたとされる．ギリシア語 αὔω (aúō) 「火をおこす」と同根だが，借用ではない．
  ギリシア語由来: false
  用例:
    - haustrum 「くみ上げる道具」．結腸膨起 haustra coli で使う．
    - exhaurio 「くみ出す，使い果たす」．英語 exhaust の語源．
  備考: 完了幹は haus- （haus-i）．目的分詞 haus-tum も同じ haus- に -tum が付いた形である．

- 見出し: haustrum
  品詞: 名詞
  主要形:
    - haustrum
    - haustri
  曲用: 2
  性: 中性
  語義: 「水をくみ上げる道具，スコップ，桶」．解剖学では「膨起」．
  語源: haurio 「くみ上げる」の完了幹 haus- に接尾辞 -trum が付いた形．
  ギリシア語由来: false
  用例:
    - 結腸膨起 haustra coli．

- 見出し: -inus
  品詞: 接尾辞（形容詞化）
  主要形:
    - -inus
    - -ina
    - -inum
  曲用: [1, 2]
  語義: 「...の，...に関する，...から成る」．名詞から形容詞を作る．
  語源: 印欧祖語 *-iHnos に由来し，ギリシア語 -inos と同根である．i が短い -inus は，ギリシア語 -ĭnos から借用されたもので，色や植物の名前に多い．
  ギリシア語由来: false
  用例:
    - uterinus 「子宮の」．卵管 tuba uterina で使う．
    - equinus 「馬の」．馬尾 cauda equina で使う．
    - 英語 -ine （uterine, equine, marine など）．

- 見出し: -itis
  品詞: 接尾辞（名詞化）
  主要形:
    - -itis
    - -itidis
  曲用: 3
  性: 女性
  語義: 「炎症」．名詞の語幹に付いて，炎症を伴う病気の名を作る．
  語源: 新ラテン語．ギリシア語 -ῖτις (-îtis) 「...に関する」に由来し，「病気」を表す女性名詞 νόσος (nósos) に付く女性形だった．
  ギリシア語由来: true
  用例:
    - 虫垂炎 appendicitis，関節炎 arthritis．
    - 腸炎 enteritis，大腸炎 colitis．
  備考: 英語では -itis のまま使う．属格 -itidis は未確認．

- 見出し: -ium
  品詞: 接尾辞（名詞化）
  主要形:
    - -ium
    - -ii
  曲用: 2
  性: 中性
  語義: 職務や抽象概念を表す名詞，専門用語の中性名詞を作る．
  語源: 形容詞を作る接尾辞 -ius から派生した．ギリシア語の -ιον (-ion) と対応する．
  ギリシア語由来: false
  用例:
    - 心膜 pericardium，腸間膜 mesenterium．
    - 化学元素名（calcium, lithium, helium）．新ラテン語でこの語尾が標準になった．
  備考: 単数属格は -i にもなる．複数主格は -ia になる．

- 見出し: -ix
  品詞: 接尾辞（名詞化）
  主要形:
    - -ix
    - -icis
  曲用: 3
  性: 女性
  語義: 動詞から名詞を作る．
  語源: 未確認．
  ギリシア語由来: false
  用例:
    - appendix 「付属物，垂」．appendo に付いた -ix である．
    - radix 「根」．

- 見出し: latus
  品詞: 形容詞
  主要形:
    - latus
    - -a
    - -um
  曲用: [1, 2]
  語義: 「広い，ゆったりした」．
  語源: 古い形 stlatus から変化した．印欧祖語 *stelH- や *slā- との関係が提案されているが，はっきりしない．
  ギリシア語由来: false
  用例:
    - 広背筋 m. latissimus dorsi．latissimus は最上級．
    - 子宮広間膜 lig. latum uteri．
    - latitudo 「広さ，幅」．英語 latitude 「緯度」の語源．
  備考: 同じつづりの別語がある．fero 「運ぶ」の完了受動分詞 latus と，第 3 曲用中性名詞 latus 「わき腹，側面」．

- 見出し: mes-
  品詞: 接頭辞（連結形）
  語義: 「中間の，間の」．
  語源: ギリシア語 μέσος (mésos) に由来する．印欧祖語 *médʰyos 「間」に遡り，ラテン語 medius と同根．
  ギリシア語由来: true
  用例:
    - 腸間膜 mesenterium，結腸間膜 mesocolon．
    - 卵管間膜 mesosalpinx，子宮間膜 mesometrium．
    - 英語 mesoderm 「中胚葉」，Mesopotamia．
  備考: 元のギリシア語 μέσος は形容詞．連結形は meso- で，母音の前では mes- になる．

