# 語彙辞典
#
# 実習で出てきた語や接尾辞の記載事項をまとめる．
# 項目は見出しのアルファベット順（ハイフンは無視）に並べる．文体は常体とする．
#
# 記載事項
#   見出し: 見出し語
#   品詞: 品詞
#   活用: 活用または曲用
#   語義: 語義
#   語源: 語源
#   ギリシア語由来: ギリシア語由来かどうか
#   用例: 用例

- 見出し: ad-
  品詞: 接頭辞
  活用: 不変化．後ろの子音に同化する（ap-, ac- など）．
  語義: 「...へ，...のそばに」．
  語源: ラテン語の前置詞 ad に由来する．
  ギリシア語由来: 否．
  用例:
    - 内転筋 adductor．
    - appendo 「つるす」．d が p に同化して ap- になる．

- 見出し: appendix
  品詞: 名詞
  活用: 第 3 曲用子音幹女性 appendix, appendicis．
  語義: 「付属物，追加」．解剖学では「垂」．
  語源: appendo 「つるす」に接尾辞 -ix が付いた形．appendo は ap- + pendo に分けられる．
  ギリシア語由来: 否．
  用例:
    - 腹膜垂 appendices epiploicae．
    - 虫垂炎 appendicitis．ラテン語でも英語でも同じつづりである．
    - 精巣上体垂 appendix epididymis，精巣垂 appendix testis．
    - 英語 appendix 「付録，虫垂」，appendage 「付属物」．

- 見出し: appendo
  品詞: 動詞
  活用: 第 3 活用．appendō, appendere, appendī, appēnsum （現在，不定詞，完了，目的分詞）．
  語義: 「つるす，ぶら下げる」．「量る」．
  語源: ad- + pendo．ad- の d が p に同化して ap- になった．
  ギリシア語由来: 否．
  用例:
    - appendix 「付属物，垂」．
    - 英語 append 「付け加える」．

- 見出し: colon
  品詞: 名詞
  活用: 第 2 曲用中性 colon, coli．
  語義: 「結腸，大腸」．
  語源: ギリシア語 κόλον (kólon) 「大腸」の借用．
  ギリシア語由来: 是．
  用例:
    - 上行結腸 colon ascendens，横行結腸 colon transversum．
    - 結腸間膜 mesocolon．
    - 英語 colitis 「大腸炎」，colic 「疝痛」は colon に由来する．

- 見出し: enter-
  品詞: 名詞語幹（連結形）
  活用: 元のギリシア語 ἔντερον (énteron) は第 2 曲用中性．
  語義: 「腸，内臓」．
  語源: ギリシア語 ἔντερον (énteron) に由来する．印欧祖語 *h₁én 「中に」に比較級の接尾辞 *-teros が付いた形とされる．
  ギリシア語由来: 是．
  用例:
    - 腸間膜 mesenterium．
    - 腸内細菌の一属 Enterobacter．
    - 英語 enteritis 「腸炎」，dysentery 「赤痢」．

- 見出し: epiplo-
  品詞: 名詞語幹（連結形）
  活用: 元のギリシア語 ἐπίπλοον (epíploon) は第 2 曲用中性．
  語義: 「大網」．
  語源: ギリシア語 ἐπίπλοον (epíploon) に由来する．ἐπι- 「上に」に「膜」を表す語根が付いた形とされる．
  ギリシア語由来: 是．
  用例:
    - 腹膜垂 appendices epiploicae，網嚢孔 foramen epiploicum．
    - 右胃大網動脈 a. gastroepiploica dextra．
    - 英語 epiploon 「大網」，epiplocele 「大網ヘルニア」．

- 見出し: haurio
  品詞: 動詞
  活用: 第 4 活用．hauriō, haurīre, hausī, haustum （現在，不定詞，完了，目的分詞）．完了幹は haus- （haus-ī）．目的分詞 haus-tum も同じ haus- に -tum が付いた形である．
  語義: 「くみ上げる，くみ出す」．転じて「飲みほす，吸い込む，使い尽くす，取り出す」．
  語源: 印欧祖語 *h₂ews- 「くみ上げる」に由来する．語頭の h- は後から付いたとされる．
  ギリシア語由来: 否．ギリシア語 αὔω (aúō) 「火をおこす」と同根だが，借用ではない．
  用例:
    - haustrum 「くみ上げる道具」．結腸膨起 haustra coli で使う．
    - exhaurio 「くみ出す，使い果たす」．英語 exhaust の語源．

- 見出し: haustrum
  品詞: 名詞
  活用: 第 2 曲用中性 haustrum, haustri．
  語義: 「水をくみ上げる道具，スコップ，桶」．解剖学では「膨起」．
  語源: haurio 「くみ上げる」の完了幹 haus- に接尾辞 -trum が付いた形．
  ギリシア語由来: 否．
  用例:
    - 結腸膨起 haustra coli．

- 見出し: -itis
  品詞: 接尾辞（名詞化）
  活用: 第 3 曲用女性 -itis, -itidis （ラテン語）．英語では -itis のまま使う．
  語義: 「炎症」．名詞の語幹に付いて，炎症を伴う病気の名を作る．
  語源: 新ラテン語．ギリシア語 -ῖτις (-îtis) 「...に関する」に由来し，「病気」を表す女性名詞 νόσος (nósos) に付く女性形だった．
  ギリシア語由来: 是．
  用例:
    - 虫垂炎 appendicitis，関節炎 arthritis．
    - 腸炎 enteritis，大腸炎 colitis．

- 見出し: -ium
  品詞: 接尾辞（名詞化）
  活用: -ium で終わる名詞は第 2 曲用中性 -ium, -ii（-i），複数主格は -ia になる．
  語義: 職務や抽象概念を表す名詞，専門用語の中性名詞を作る．
  語源: 形容詞を作る接尾辞 -ius から派生した．ギリシア語の -ιον (-ion) と対応する．
  ギリシア語由来: 否．ラテン語の接尾辞である．
  用例:
    - 心膜 pericardium，腸間膜 mesenterium．
    - 化学元素名（calcium, lithium, helium）．新ラテン語でこの語尾が標準になった．

- 見出し: -ix
  品詞: 接尾辞（名詞化）
  活用: 第 3 曲用女性 -ix, -icis．
  語義: 動詞から名詞を作る．
  語源: 未確認．
  ギリシア語由来: 否．ラテン語の語に付く接尾辞である．
  用例:
    - appendix 「付属物，垂」．appendo に付いた -ix である．
    - radix 「根」．

- 見出し: mes-
  品詞: 接頭辞（連結形）
  活用: 元のギリシア語 μέσος (mésos) は形容詞．連結形は meso- で，母音の前では mes- になる．
  語義: 「中間の，間の」．
  語源: ギリシア語 μέσος (mésos) に由来する．印欧祖語 *médʰyos 「間」に遡り，ラテン語 medius と同根．
  ギリシア語由来: 是．
  用例:
    - 腸間膜 mesenterium，結腸間膜 mesocolon．
    - 卵管間膜 mesosalpinx，子宮間膜 mesometrium．
    - 英語 mesoderm 「中胚葉」，Mesopotamia．

- 見出し: mesenterium
  品詞: 名詞
  活用: 第 2 曲用中性 mesenterium, mesenterii．
  語義: 「腸間膜」．
  語源: 後期ラテン語 mesenterium で，ギリシア語 μεσεντέριον (mesentérion) に由来する．mes- + enter- + -ium に分けられる．
  ギリシア語由来: 是．
  用例:
    - 腸間膜根 radix mesenterii．
    - 英語 mesentery．

- 見出し: mesocolon
  品詞: 名詞
  活用: 第 2 曲用中性（colon と同じ）．
  語義: 「結腸間膜」．
  語源: mes- + o + colon の合成語．Wiktionary にラテン語の項目はなく，構成要素からの分析である．
  ギリシア語由来: 是．mes- も colon もギリシア語に由来する．
  用例:
    - 横行結腸間膜 mesocolon transversum．
    - S 状結腸間膜 mesocolon sigmoideum．

- 見出し: pendo
  品詞: 動詞
  活用: 第 3 活用．pendō, pendere, pependī, pēnsum （現在，不定詞，完了，目的分詞）．
  語義: 「量る」，「支払う」．転じて「よく考える」．
  語源: 印欧祖語 *(s)pend- 「引く，紡ぐ」に由来する．
  ギリシア語由来: 否．
  用例:
    - appendo 「つるす」．
    - 英語 pendant 「ペンダント」，suspender 「サスペンダー」．

- 見出し: radix
  品詞: 名詞
  活用: 第 3 曲用女性 radix, radicis．
  語義: 「根」．転じて「基礎，源，起源」．
  語源: 印欧祖語 *wréh₂ds に由来する．
  ギリシア語由来: 否．
  用例:
    - 腸間膜根 radix mesenterii．
    - 英語 radical 「根本的な」，radish 「ラディッシュ」，eradicate 「根絶する」．

- 見出し: rectus
  品詞: 形容詞
  活用: 第 1・2 曲用 rectus, -a, -um．
  語義: 「まっすぐな，正しい」．
  語源: regō の完了受動分詞．印欧祖語 *h₃reǵtós 「まっすぐにされた」に遡る．
  ギリシア語由来: 否．
  用例:
    - 直腸 rectum．本来は intestinum rectum で，形容詞を名詞に転用した．
    - 腹直筋 rectus abdominis．
    - 英語 correct 「正しい」，direct 「まっすぐな」，erect 「直立した」．

- 見出し: rego
  品詞: 動詞
  活用: 第 3 活用．regō, regere, rēxī, rēctum （現在，不定詞，完了，目的分詞）．
  語義: 「まっすぐにする，導く」．転じて「支配する，統治する，操る」．
  語源: 印欧祖語 *h₃réǵeti 「まっすぐにする」に由来する．
  ギリシア語由来: 否．
  用例:
    - rectus 「まっすぐな」．直腸 rectum で使う．
    - 英語 direct 「まっすぐな，指示する」，correct 「正しい」，regent 「摂政」．

- 見出し: tenia
  品詞: 名詞
  活用: 第 1 曲用女性 tenia, teniae．
  語義: 「ひも，リボン」．解剖学では，ひも状の構造を指す．
  語源: ギリシア語 ταινία (tainía) 「リボン」の借用．taenia は異綴で，解剖学では tenia，微生物学では taenia を使う．
  ギリシア語由来: 是．
  用例:
    - 結腸ヒモ teniae coli．
    - 大網ヒモ taenia omentalis，間膜ヒモ taenia mesocolica．
    - 条虫の属名 Taenia，英語 taeniasis 「条虫症」．

- 見出し: -trum
  品詞: 接尾辞（名詞化）
  活用: -trum で終わる名詞は第 2 曲用中性 -trum, -tri になる．
  語義: 動詞から「...する道具」を表す名詞を作る．
  語源: 印欧祖語 *-trom に由来する．語幹が s で終わる動詞に付くと -strum の形になる．
  ギリシア語由来: 否．ラテン語固有の接尾辞である．ただしギリシア語の -τρον (-tron) で終わる語が -trum の形で借用されている（sceptrum, metrum）．
  用例:
    - haustrum 「くみ上げる道具」．haurio の完了幹 haus- に付いた -trum である．
    - rostrum 「くちばし」．脳梁吻 rostrum corporis callosi で使う．英語 rostrum 「演壇」の語源．
    - claustrum 「閉ざすもの，囲い」．前障 claustrum で使う．
    - spectrum 「姿」．動詞 specio 「見る」に -trum が付いた形．英語 spectrum 「スペクトル」の語源．
