- 見出し: metr-
  品詞: 名詞語幹（連結形）
  語義: 「子宮」．「母」．
  語源: ギリシア語 μήτρα (mḗtra) 「子宮」に由来する．μήτρα は μήτηρ (mḗtēr) 「母」から作られた語で，μήτηρ は印欧祖語 *méh₂tēr に遡り，ラテン語 mater，英語 mother と同根である．
  ギリシア語由来: true
  用例:
    - 子宮間膜 mesometrium．
    - 英語 endometrium 「子宮内膜」，metritis 「子宮炎」．
    - 英語 metro 「地下鉄」．métropolitain の略で，metropolis 「母なる都市」は μήτηρ 「母」+ πόλις 「都市」から作られた．
    - 英語 maternal 「母の」，maternity 「母であること」．μήτηρ と同根のラテン語 mater 「母」に由来する．
  備考: 元のギリシア語 μήτρα は女性名詞．英語 meter 「メートル，計器」は μέτρον (métron) 「尺度」に由来する別語で，つづりが似ているだけである．endometrium と metritis は記憶による．

